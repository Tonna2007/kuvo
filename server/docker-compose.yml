services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kuvo
      POSTGRES_PASSWORD: kuvo
      POSTGRES_DB: kuvo
    ports:
      - "5432:5432"
    volumes:
      - kuvo_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kuvo -d kuvo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_ENV: dev
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://kuvo:kuvo@postgres:5432/kuvo?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-only-change-me
      OTP_PEPPER: dev-only-pepper
      DEV_OTP: "1234"
      CORS_ORIGINS: "*"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  kuvo_pg:
